[project]
name = "raspberry-pi-ide-simulator"
version = "1.0.0"
description = "A professional Raspberry Pi IDE simulator with hardware component visualization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Omer Asayag", email = "omer@example.com"}]
keywords = ["raspberry pi", "ide", "simulation", "hardware"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.2.6",
    "pygame>=2.6.1",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "uvicorn>=0.53.0",
]
[project.scripts]
raspberry-pi-ide = "run_simulator:main"
